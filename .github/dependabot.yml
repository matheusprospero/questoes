# Dependabot: mantém as Actions fixadas por SHA (com o comentário da versão) e avisa
# de advisory nas dependências. Criado na varredura de segurança de 2026-10-23.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
